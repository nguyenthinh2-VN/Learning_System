spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

payment:
  provider: ${PAYMENT_PROVIDER:mock}

vietqr:
  bank-id: ${VIETQR_BANK_ID:MB}
  account-no: ${VIETQR_ACCOUNT_NO:1234567890}
  account-name: ${VIETQR_ACCOUNT_NAME:CONG TY TNHH MTV ThinhDev}
  webhook-secret: ${VIETQR_WEBHOOK_SECRET:change-me}

wallet:
  topup:
    min-amount: 10000
    pending-ttl-minutes: 15

storage:
  local:
    base-dir: ${STORAGE_DIR:./uploads}

  public-base-url: ${PUBLIC_BASE_URL}