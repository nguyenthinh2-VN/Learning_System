spring:
  datasource:
    url: jdbc:mysql://localhost:3306/learning_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
server:
  port: 8080
logging:
  level:
    com.example.learning_system_spring: DEBUG

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1sZWFybmluZy1zeXN0ZW0tc3ByaW5nLWFwcGxpY2F0aW9uLWp3dC1zZWNyZXQ=
  expiration: 86400000

# Payment Gateway
# "mock"  = dev mode (dùng POST /api/v1/webhook/mock?ref=... để test)
# "vnpay" = VNPay sandbox/production (điền credential bên dưới)
payment:
  provider: vnpay

# Chỉ dùng khi payment.provider=vnpay.
# Đăng ký sandbox tại https://sandbox.vnpayment.vn để lấy tmn-code + hash-secret.
vnpay:
  tmn-code: K88M3Q7U
  hash-secret: FKDTB85IYTA013UJQ70IKAX4FCW9368D
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:5173/wallet/vnpay-return
  ipn-url: http://localhost:8080/api/v1/webhook/vnpay-ipn   # production: thay bằng URL public/ngrok
  complete-mode: RETURN    # DEV=RETURN (không cần ngrok); PRODUCTION=IPN
  ttl-minutes: 15

# Wallet config
wallet:
  topup:
    min-amount: 10000
    pending-ttl-minutes: 15

# Local file storage (avatar, ...)
storage:
  local:
    base-dir: ./uploads
  public-base-url: http://localhost:8080
